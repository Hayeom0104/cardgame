<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}덱아웃 관리{% endblock %}</title>
<style>
  /* 외부 CDN을 쓰지 않는다 — 봇 서비스가 나갈 수 있는 환경을 좁히지 않기 위해서다. */
  :root {
    --bg: #16181f; --panel: #1e212b; --line: #2f3442; --text: #e6e8ee;
    --muted: #9aa1b4; --accent: #e2ba60; --good: #60c878; --bad: #d85c5c;
    --warn: #d8a45c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
    padding: 14px 22px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 700; color: var(--accent); margin-right: 8px; }
  header nav { display: flex; gap: 16px; flex-wrap: wrap; }
  header .spacer { flex: 1; }
  main { padding: 22px; max-width: 1100px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 26px 0 10px; color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  code, pre, textarea, input[type=text], input[type=password] {
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  textarea, input[type=text], input[type=password] {
    width: 100%; background: #12141a; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font-size: 13px;
  }
  textarea { min-height: 84px; resize: vertical; }
  button {
    background: var(--accent); color: #1b1b1b; border: 0; border-radius: 6px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--bad); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.current { border-color: var(--good); color: var(--good); }
  .pill.draft { border-color: var(--warn); color: var(--warn); }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .setting { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .setting:last-child { border-bottom: 0; }
  .setting .name { font-weight: 700; font-family: ui-monospace, monospace; }
  .setting .doc { color: var(--muted); font-size: 13px; white-space: pre-wrap; margin: 4px 0 8px; }
  #toast {
    position: fixed; right: 18px; bottom: 18px; background: var(--panel);
    border: 1px solid var(--line); border-left: 4px solid var(--accent);
    padding: 12px 16px; border-radius: 6px; max-width: 460px;
    display: none; white-space: pre-wrap; box-shadow: 0 6px 24px #0008;
  }
  .banner { border-left: 4px solid var(--warn); padding: 10px 14px; background: var(--panel); border-radius: 6px; margin-bottom: 16px; }
</style>
</head>
<body>
{% if logged_in %}
<header>
  <span class="brand">덱아웃 관리</span>
  <nav>
    <a href="/admin/">현황</a>
    <a href="/admin/balance">밸런싱</a>
    <a href="/admin/content">콘텐츠</a>
    <a href="/admin/assets">그림</a>
    <a href="/admin/versions">버전</a>
    <a href="/admin/players">플레이어</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted">
    현재 v{{ current_version or '—' }}{% if draft_version %} · 초안 v{{ draft_version }}{% endif %}
  </span>
  <a href="/admin/logout">로그아웃</a>
</header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
<div id="toast"></div>
<script>
  function toast(message, ok) {
    const box = document.getElementById('toast');
    box.textContent = message;
    box.style.borderLeftColor = ok ? 'var(--good)' : 'var(--bad)';
    box.style.display = 'block';
    clearTimeout(box._timer);
    box._timer = setTimeout(() => { box.style.display = 'none'; }, 6000);
  }
  // 변경은 전부 JSON POST로 보낸다. 폼 인코딩을 쓰지 않으므로 추가 의존성이 없다.
  async function post(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body || {}),
    });
    let data = {};
    try { data = await response.json(); } catch (e) { /* 본문 없음 */ }
    toast(data.message || (response.ok ? '완료' : '실패'), response.ok);
    return response.ok ? data : null;
  }
</script>
</body>
</html>
