<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}콘텐츠 대시보드{% endblock %} · {{ settings.bot_name }}</title>
  <style>
    :root {
      --bg: #16181f; --panel: #21242f; --panel-2: #2b2f3d; --line: #3a3f52;
      --fg: #e8eaf0; --muted: #969baa; --accent: #6ca0ff; --danger: #de545c;
      --ok: #56c47a; --gold: #e8be60;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: -apple-system, "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
           font-size: 14px; line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: var(--panel); border-bottom: 1px solid var(--line);
             padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
    header .brand { font-weight: 700; font-size: 16px; }
    header nav { display: flex; gap: 16px; flex: 1; }
    header .me { color: var(--muted); font-size: 13px; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
             background: var(--panel-2); border: 1px solid var(--line); }
    .badge.owner { color: var(--gold); border-color: var(--gold); }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin-bottom: 24px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 20px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
    .stat .n { font-size: 28px; font-weight: 700; }
    .stat .l { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    tr:hover td { background: var(--panel-2); }
    .btn { display: inline-block; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line);
           background: var(--panel-2); color: var(--fg); cursor: pointer; font-size: 13px; }
    .btn:hover { border-color: var(--accent); text-decoration: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #16181f; font-weight: 600; }
    .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    .field { margin-bottom: 18px; }
    .field .help { color: var(--muted); font-size: 12px; margin-top: 4px; }
    input[type=text], input[type=number], textarea, select {
      width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--bg); color: var(--fg); font-family: inherit; font-size: 14px; }
    textarea { min-height: 80px; resize: vertical; }
    textarea.json { font-family: ui-monospace, Menlo, monospace; min-height: 130px; font-size: 13px; }
    input[type=checkbox] { width: 16px; height: 16px; }
    .thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
    .note { background: #2a2418; border: 1px solid #5c4a1f; color: #e8be60;
            border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; font-size: 13px; }
    .err { background: #33202233; border: 1px solid var(--danger); color: #ff9ba1;
           border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; }
    .muted { color: var(--muted); }
    form.inline { display: inline; }
  </style>
</head>
<body>
{% if admin %}
<header>
  <span class="brand">🎴 {{ settings.bot_name }}</span>
  <nav>
    <a href="/admin/">대시보드</a>
    {% for key, s in specs.items() %}<a href="/admin/{{ key }}">{{ s.label }}</a>{% endfor %}
    {% if admin.role.value == 'owner' %}<a href="/admin/users/manage">사용자</a>{% endif %}
  </nav>
  <span class="me">
    {{ admin.username or admin.discord_id }}
    <span class="badge {{ 'owner' if admin.role.value == 'owner' else '' }}">{{ admin.role.value }}</span>
    · <a href="/admin/logout">로그아웃</a>
  </span>
</header>
{% endif %}
<main>
  {% block body %}{% endblock %}
</main>
</body>
</html>
