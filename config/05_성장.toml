#  성장 — 성급, 카드 업그레이드, 연구, 장비 강화에 드는 비용
#
#  런 밖에서 계정을 영구히 강하게 만드는 모든 비용이 여기 모여 있습니다.
#  "얼마나 강해지는가"는 `01_전투.toml` 에, "그렇게 되는 데 얼마가 드는가"는
#  이 파일에 있습니다.


# ─────────────────────────────────────────────────────────────
#  연구 (계정 전체 능력치 강화)
# ─────────────────────────────────────────────────────────────

# 연구 단계를 하나 올릴 때마다 모든 캐릭터의 능력치가 늘어나는 비율입니다.
# 0.03 = 단계당 3% 증가.
research_stat_bonus_per_step = 0.03

# 연구로 올릴 수 있는 최대 단계입니다. 최종 증가폭은
# research_stat_bonus_per_step × research_stat_max_steps 가 됩니다.
research_stat_max_steps = 10

# 연구 강화가 실제로 적용되는 능력치 목록입니다.
# 속도(spd)는 일부러 빠져 있습니다 — 속도는 곱해서 올리지 않습니다.
research_stat_applies_to = ["hp", "atk", "def"]


# ─────────────────────────────────────────────────────────────
#  성급 (★)
# ─────────────────────────────────────────────────────────────

# 일반 캐릭터가 올릴 수 있는 최대 성급입니다.
star_cap_normal = 3

# 특별 캐릭터에게만 허용되는 최대 성급입니다. 캐릭터별로 지정합니다.
star_cap_special = 6


# ─────────────────────────────────────────────────────────────
#  카드 업그레이드
# ─────────────────────────────────────────────────────────────

# 카드를 올릴 수 있는 최고 단계입니다. 0은 뽑은 그대로의 상태입니다.
card_upgrade_max_tier = 5

# 이 단계로 올라갈 때부터 와일드카드가 필요해집니다.
# 3 이면 2→3 전이부터 와일드카드를 씁니다. 아래 비용표와 어긋나면 안 됩니다.
card_upgrade_wildcard_from_tier = 3

# 업그레이드로 카드에 새로 붙는 상태이상의 지속 라운드 상한입니다.
# 상태 자신의 기본 지속시간에도 함께 묶이므로, 둘 중 짧은 쪽이 적용됩니다.
card_upgrade_max_applied_duration = 4


# ─────────────────────────────────────────────────────────────
#  장비 강화
# ─────────────────────────────────────────────────────────────

# 장비를 올릴 수 있는 최고 등급입니다.
equipment_max_tier = 6


# ─────────────────────────────────────────────────────────────
#  비용표
# ─────────────────────────────────────────────────────────────

# 성급을 올리는 비용입니다. 왼쪽 숫자는 "지금 성급"이며,
# 1 = 1★에서 2★로 올릴 때 드는 비용입니다.
[star_up_costs]
1 = { fragments = 10,  wildcards = 1,  coin = 3000 }
2 = { fragments = 25,  wildcards = 3,  coin = 10000 }
3 = { fragments = 50,  wildcards = 8,  coin = 30000 }
4 = { fragments = 90,  wildcards = 15, coin = 70000 }
5 = { fragments = 150, wildcards = 30, coin = 150000 }

# 카드 업그레이드 비용입니다. 왼쪽 숫자는 "올라갈 단계"이며,
# 1 = 0단계에서 1단계로 올릴 때 드는 비용입니다.
# 곡선은 일부러 뒤로 갈수록 가팔라집니다 — 2→3 부터 확 비싸지고,
# 와일드카드도 그때부터 듭니다.
[card_upgrade_costs]
1 = { fragments = 20,  wildcards = 0,  coin = 2000 }
2 = { fragments = 45,  wildcards = 0,  coin = 6000 }
3 = { fragments = 110, wildcards = 2,  coin = 20000 }
4 = { fragments = 240, wildcards = 5,  coin = 55000 }
5 = { fragments = 500, wildcards = 12, coin = 140000 }

# 각 업그레이드 단계에서 카드에 "새 능력"을 붙일 수 있는지, 붙인다면 어떤
# 상태이상까지 쓸 수 있는지입니다. 왼쪽 숫자는 올라갈 단계입니다.
#   []                                  능력 추가 없이 숫자만 바뀝니다.
#   ["player_only"]                     아군에게 이로운 상태만 붙일 수 있습니다.
#   ["player_only","enemy_only","universal"]  모든 상태를 붙일 수 있습니다.
# 목록을 넓힐수록 그 단계에서 카드가 크게 변합니다.
[card_upgrade_scopes_by_tier]
1 = []
2 = ["player_only"]
3 = ["player_only"]
4 = ["player_only", "enemy_only", "universal"]
5 = ["player_only", "enemy_only", "universal"]

# 장비를 한 등급 올리는 데 드는 강화석입니다. 왼쪽 숫자는 올라갈 등급입니다.
#   current   올라갈 등급과 같은 등급의 강화석 개수
#   previous  한 단계 아래 등급의 강화석 개수
# 1등급만 previous 가 0인데, 그 아래 등급의 강화석이 존재하지 않기 때문입니다.
[enhancement_costs]
1 = { current = 2,  previous = 0 }
2 = { current = 3,  previous = 2 }
3 = { current = 4,  previous = 4 }
4 = { current = 6,  previous = 7 }
5 = { current = 8,  previous = 11 }
6 = { current = 10, previous = 16 }
