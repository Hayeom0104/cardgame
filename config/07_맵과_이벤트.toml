#  맵과 이벤트 — 런 하나의 지도가 만들어지는 방식
#
#  런을 시작하면 여기 규칙에 따라 지도를 새로 만듭니다. 만들어진 지도가
#  규칙을 통과하지 못하면 몇 번 다시 시도하고, 그래도 실패하면 미리 검증된
#  고정 지도로 대체합니다 — 런이 시작되지 못하는 일은 없습니다.


# ─────────────────────────────────────────────────────────────
#  지도 모양
# ─────────────────────────────────────────────────────────────

# 보스를 뺀 지도의 칸 수입니다. 아래 map_depth_structure 의 합과 같아야 합니다.
map_node_count = 15

# 깊이별 칸 수입니다. 왼쪽부터 1번째 깊이, 2번째 깊이 … 순서입니다.
# [1, 2, 3, 3, 3, 2, 1] 은 하나에서 시작해 셋으로 넓어졌다가 다시 하나로
# 좁아지는 모양이며, 마지막 칸 다음에 보스가 붙습니다.
map_depth_structure = [1, 2, 3, 3, 3, 2, 1]

# 한 칸에서 다음 깊이로 이어지는 길의 최소 개수입니다.
# 0이 되면 막다른 길이 생겨 런을 더 진행할 수 없게 됩니다.
map_out_degree_min = 1

# 한 칸에서 다음 깊이로 이어지는 길의 최대 개수입니다.
# 올리면 갈림길이 많아져 지도가 넓게 퍼집니다.
map_out_degree_max = 3

# 이 깊이까지는 갈림길이 반드시 둘 이상이어야 합니다.
# 초반에 선택지가 없으면 로그라이크의 재미가 사라지기 때문입니다.
map_wide_branch_max_depth = 4

# 위 구간에서 보장되는 최소 갈림길 수입니다.
map_wide_branch_min = 2

# 갈림길을 억지로 넓히지 않는 깊이들입니다.
# 후반은 보스 앞 한 칸으로 자연스럽게 좁아져야 하므로 여기서는 길이 하나여도
# 정상으로 봅니다.
map_converging_depths = [5, 6]

# 상점 칸이 놓일 수 있는 가장 얕은 깊이입니다.
# 3 이면 1·2 깊이에는 상점이 나오지 않습니다 — 시작하자마자 돈도 없이
# 상점을 만나는 일을 막습니다.
map_shop_min_depth = 3

# 휴식 칸끼리 떨어져 있어야 하는 최소 깊이 간격입니다.
# 2 면 붙어 있는 두 깊이에 휴식이 동시에 나오지 않습니다.
map_rest_min_depth_gap = 2

# 규칙을 만족하는 지도가 나올 때까지 다시 만들어 보는 횟수입니다.
# 모두 실패하면 고정 지도로 대체합니다.
map_generation_attempts = 16

# 칸 종류(전투·이벤트·보상 …)를 배치할 때 다시 섞어보는 횟수입니다.
map_node_shuffle_attempts = 32


# ─────────────────────────────────────────────────────────────
#  칸의 내용
# ─────────────────────────────────────────────────────────────

# 휴식 칸에서 회복되는 최대 체력의 비율입니다. 0.30 = 30% 회복.
rest_heal_pct = 0.30

# 튜토리얼 월드의 휴식 칸 회복량입니다. 본편보다 후하게 두어 처음 하는
# 사람이 쉽게 막히지 않도록 합니다.
rest_heal_pct_tutorial = 0.50

# 보상 칸에서 한 번에 보여주는 카드 후보의 수입니다.
reward_cards_offered = 3

# 저주받은 카드를 없앨 때 대신 잃는 최대 체력의 비율입니다. 0.15 = 15%.
curse_removal_hp_pct = 0.15

# 저주받은 카드를 코인으로 없앨 때의 가격입니다.
curse_removal_coin = 1200


# ─────────────────────────────────────────────────────────────
#  표로 된 설정
# ─────────────────────────────────────────────────────────────

# 지도에 들어갈 칸 종류별 개수입니다. 합이 map_node_count 와 같아야 합니다.
# 보스는 따로 붙으므로 여기 세지 않습니다.
[map_node_quota]
"전투"   = 7
"이벤트" = 3
"보상"   = 2
"휴식"   = 2
"상점"   = 1

# 보상 칸에서 어느 희귀도 묶음의 카드가 나올지에 대한 확률입니다.
# 세 값의 합은 1.0 이어야 합니다. high 를 올리면 좋은 카드가 자주 나옵니다.
[reward_rarity_weights]
low  = 0.60
mid  = 0.33
high = 0.07

# 위 low / mid / high 가 각각 어느 희귀도까지를 뜻하는지입니다.
# low = 3 이면 희귀도 1~3, mid = 5 면 4~5, 그보다 위는 전부 high 입니다.
[reward_rarity_band_max_tier]
low = 3
mid = 5

# 이벤트에서 주고받는 값의 범위입니다. 이벤트 내용 자체는 콘텐츠로 따로
# 정의되어 있고, 여기서는 그 크기만 정합니다.
#   small_coin            소액 코인 보상 [최저, 최고]
#   large_card_fragments  큰 카드 조각 보상 [최저, 최고]
#   run_currency          탐험 자금 보상 [최저, 최고]
#   hp_cost_pct           체력을 대가로 치를 때의 비율 [최저, 최고]
#   carta_drop_chance     이벤트에서 카르타가 나올 확률 (0.005 = 0.5%)
#   carta_drop_amount     나왔을 때의 액수 [최저, 최고]
#   curse_insert_chance   나쁜 선택지에서 저주받은 카드가 들어올 확률
[event_bands]
small_coin           = [200, 500]
large_card_fragments = [80, 200]
run_currency         = [30, 80]
hp_cost_pct          = [0.10, 0.20]
carta_drop_chance    = 0.005
carta_drop_amount    = [150, 300]
curse_insert_chance  = 0.35
