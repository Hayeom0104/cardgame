#  튜토리얼 — 처음 하는 사람이 겪는 첫 월드
#
#  튜토리얼은 캐릭터 한 명으로 진행하는 유일한 구간입니다. 본편은 파티가
#  둘 이상이어야 들어갈 수 있으므로, 튜토리얼을 마치면 두 번째 캐릭터를
#  구할 수 있도록 카르타와 파티 자리를 함께 줍니다.
#  이 보상을 0으로 만들면 처음 하는 사람이 본편에 영영 들어가지 못합니다.


# ─────────────────────────────────────────────────────────────
#  보상
# ─────────────────────────────────────────────────────────────

# 튜토리얼을 마쳤을 때 주는 카르타입니다.
# 뽑기 1회 비용(gacha_cost_single)보다 넉넉해야 두 번째 캐릭터를 구할
# 기회가 생깁니다.
tutorial_reward_carta = 300

# 튜토리얼을 마쳤을 때 열어주는 파티 자리 수입니다.
# 본편이 요구하는 최소 인원(2명)과 맞아야 합니다.
tutorial_reward_party_slot = 2


# ─────────────────────────────────────────────────────────────
#  난이도
# ─────────────────────────────────────────────────────────────

# 튜토리얼 보스가 페이즈를 바꾸는 체력 비율입니다.
# 본편 보스(2단계)보다 단순하게 한 번만 바뀝니다.
tutorial_boss_thresholds = [0.50]

# 튜토리얼의 전투 한 칸에 나오는 적의 수 범위입니다. [최저, 최고].
tutorial_enemies_per_node = [1, 2]

# 튜토리얼 일반 적의 능력치 범위입니다. 본편의 일반 적(enemy_bands)보다
# 확실히 약하게 두어, 캐릭터 한 명으로도 이길 수 있어야 합니다.
[tutorial_enemy_band]
hp  = [30, 42]
atk = [9, 13]
def = [2, 4]
spd = [80, 100]

# 튜토리얼 보스의 능력치입니다. 값 하나만 적으면 항상 그 값이고,
# [최저, 최고] 로 적으면 그 사이에서 정해집니다.
[tutorial_boss]
hp  = 100
atk = [10, 13]
def = 4
spd = 95

# 런을 시작할 때 만들어지는 기본 덱의 구성입니다.
#   평타          아무 캐릭터나 낼 수 있는 기본 공격 카드
#   기본_방어     아무 캐릭터나 낼 수 있는 기본 방어 카드
#   starter_skill 그 캐릭터의 속성에 맞는 카드로 채우는 나머지 자리
# 세 값의 합이 base_deck_size 와 같아야 덱이 정확히 채워집니다.
# 기본 카드 비중을 낮추면 강한 카드가 자주 잡히지만, 초반에 낼 카드가
# 없어 자동 방어만 하게 될 위험이 커집니다.
[starter_deck_composition]
"평타"          = 6
"기본_방어"     = 5
starter_skill = 7
