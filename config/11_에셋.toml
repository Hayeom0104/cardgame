#  에셋 — 직접 넣은 그림(PNG)을 게임이 찾아 쓰는 규칙
#
#  `assets/` 아래에 정해진 이름으로 PNG를 넣으면 그 그림이 자동으로 쓰입니다.
#  코드를 고치거나 서비스를 다시 띄울 필요가 없습니다 — 파일을 바꾸면 다음
#  화면부터 새 그림이 나갑니다.
#
#  그림이 없거나 깨졌으면 이름과 희귀도 색으로 대신 그립니다. 그러니 그림을
#  하나도 넣지 않아도 게임은 정상 동작하고, 있는 것부터 하나씩 채워가면 됩니다.
#
#  넣는 방법:
#     assets/cards/card_화염구.png     ← 카드 그림
#     assets/characters/char_ember.png ← 캐릭터 그림
#  파일 이름은 콘텐츠의 id 와 똑같이 맞춥니다. 어떤 id 가 필요한지는
#     python -m app.cli.assets 없음
#  으로 확인할 수 있습니다.


# ─────────────────────────────────────────────────────────────
#  공통 규칙
# ─────────────────────────────────────────────────────────────

# 그림을 찾을 최상위 폴더입니다. 저장소 루트 기준의 상대 경로입니다.
asset_root = "assets"

# 허용하는 파일 확장자입니다. 위에서부터 찾아 먼저 있는 것을 씁니다.
# PNG 를 먼저 두어, 같은 이름의 jpg 와 png 가 있으면 png 가 이깁니다.
asset_extensions = [".png", ".webp", ".jpg", ".jpeg"]

# 그림 한 장의 최대 크기(바이트)입니다. 이보다 큰 파일은 쓰지 않고 대체
# 그림을 그립니다 — 화면 하나를 만드는 데 너무 오래 걸리는 것을 막습니다.
# 5 MiB 입니다.
asset_max_bytes = 5242880

# 그림 한 변의 최대 픽셀 수입니다. 이보다 큰 그림은 줄여서 씁니다.
asset_max_dimension = 4096

# 그림을 기억해 두는 개수입니다. 같은 그림을 매번 파일에서 다시 읽지 않도록
# 합니다. 파일을 바꾸면 수정 시각이 달라져 자동으로 다시 읽습니다.
asset_cache_size = 256


# ─────────────────────────────────────────────────────────────
#  종류별 폴더와 크기
# ─────────────────────────────────────────────────────────────

# 그림 종류마다 어느 폴더에서 찾고 어떤 크기로 그릴지입니다.
#   directory  `assets/` 아래의 폴더 이름
#   size       [가로, 세로] 픽셀. 넣은 그림은 이 크기에 맞춰 잘라 채웁니다.
#   fit        "cover" 는 비율을 지키며 꽉 채우고 넘치는 부분을 자릅니다.
#              "contain" 은 잘리지 않게 전부 넣고 남는 자리를 비웁니다.
#
# 넣는 그림의 비율을 size 와 비슷하게 맞추면 잘리는 부분이 적습니다.
[asset_kinds]

# 카드 그림. 파일 이름은 카드 id 입니다. (예: assets/cards/card_화염구.png)
card = { directory = "cards", size = [180, 250], fit = "cover" }

# 캐릭터 초상화. 파일 이름은 캐릭터 id 입니다.
character = { directory = "characters", size = [140, 140], fit = "cover" }

# 패시브 카드 그림. 파일 이름은 패시브 id 입니다.
# (예: assets/passives/pas_예리함.png) 행동 카드와 같은 크기로 그립니다.
passive = { directory = "passives", size = [180, 250], fit = "cover" }

# 적 그림. 파일 이름은 적 id 입니다.
enemy = { directory = "enemies", size = [140, 140], fit = "cover" }

# 뽑기 배너의 큰 그림. 파일 이름은 배너 id 입니다.
banner = { directory = "banners", size = [860, 260], fit = "cover" }

# 월드 그림. 지도 화면의 바탕으로 씁니다.
world = { directory = "worlds", size = [900, 560], fit = "cover" }

# 장비 그림. 파일 이름은 장비 정의 id 입니다.
equipment = { directory = "equipment", size = [96, 96], fit = "contain" }

# 상태이상 아이콘. 파일 이름은 상태 id 입니다. (예: assets/statuses/화상.png)
status = { directory = "statuses", size = [32, 32], fit = "contain" }

# 화면 장식용 그림(테두리, 배경 등). 파일 이름은 자유롭게 정합니다.
ui = { directory = "ui", size = [0, 0], fit = "contain" }

# 가입 화면의 홍보 그림(A-1.1). Pillow로 그리지 않는 고정 이미지입니다 —
# 없으면 그냥 첨부 없이 화면이 나갑니다. 파일 이름은 "join" 하나뿐입니다.
# (예: assets/promo/join.png)
promo = { directory = "promo", size = [860, 260], fit = "cover" }
