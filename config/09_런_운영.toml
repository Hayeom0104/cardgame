#  런 운영 — 런이 끝날 때와 방치될 때의 처리
#
#  런을 깨지 못하고 끝냈을 때 얻은 물건을 얼마나 들고 나올 수 있는지,
#  그리고 아무 조작 없이 방치된 런을 언제 정리할지를 정합니다.


# ─────────────────────────────────────────────────────────────
#  계정 시작값
# ─────────────────────────────────────────────────────────────

# 계정을 처음 만들 때 주는 카르타입니다.
# 뽑기 10회 비용(gacha_cost_ten)에 맞춰 두면 시작하자마자 묶음 뽑기를
# 한 번 할 수 있습니다.
starting_carta = 1600


# ─────────────────────────────────────────────────────────────
#  방치와 정리
# ─────────────────────────────────────────────────────────────

# 아무 조작이 없을 때 런을 만료 처리하기까지의 시간(분)입니다.
# 계정당 런은 하나뿐이라, 이 값이 없으면 방치된 런 때문에 새 런을 영영
# 시작하지 못하게 됩니다.
inactivity_expiry_minutes = 30

# 끝난 런의 스레드를 남겨두는 시간(시간)입니다. 결과를 다시 볼 수 있는
# 유예 기간이며, 지나면 정리 대상이 됩니다.
terminal_thread_retention_hours = 24


# ─────────────────────────────────────────────────────────────
#  물건 보존
# ─────────────────────────────────────────────────────────────

# 런을 깨지 못하고 끝냈을 때, 도달한 깊이에 따라 얻은 장비를 얼마나
# 들고 나올 수 있는지입니다. 위에서부터 차례로 보아 max_depth 이하인
# 첫 줄이 적용됩니다.
#   max_depth         이 깊이까지 도달했을 때 적용되는 줄
#   retain_rate       장비를 들고 나올 확률 (0.40 = 40%)
#   tier_down_chance  들고 나오더라도 등급이 한 단계 떨어질 확률
# 첫 줄이 0.00 인 것은 의도된 것입니다 — 시작하자마자 포기하는 것으로
# 이득을 볼 수 없어야 합니다.
[[retention_bands]]
max_depth        = 2
retain_rate      = 0.00
tier_down_chance = 0.00

[[retention_bands]]
max_depth        = 4
retain_rate      = 0.40
tier_down_chance = 0.60

[[retention_bands]]
max_depth        = 6
retain_rate      = 0.65
tier_down_chance = 0.35

[[retention_bands]]
max_depth        = 7
retain_rate      = 0.80
tier_down_chance = 0.20

# 보스를 잡은 뒤라면 위 표 대신 이 값이 적용됩니다.
# 기본값은 전부 들고 나오고 등급도 떨어지지 않습니다.
[retention_boss_cleared]
retain_rate      = 1.00
tier_down_chance = 0.00
