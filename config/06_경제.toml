#  경제 — 재화가 들어오는 양과 상점 가격
#
#  재화는 세 가지입니다.
#    카르타    뽑기에 쓰는 재화. 중앙봇이 관리하는 계정 공용 재화입니다.
#    코인      성장·강화에 쓰는 재화. 런을 마치면 들어옵니다.
#    탐험 자금 런 안에서만 쓰는 임시 재화. 런이 끝나면 사라집니다.


# ─────────────────────────────────────────────────────────────
#  런을 마쳤을 때
# ─────────────────────────────────────────────────────────────

# 런을 끝까지 깼을 때 받는 코인의 기본값입니다.
base_clear_coin = 1200

# 도달한 깊이 한 칸마다 위 기본값에 더해지는 코인입니다.
per_depth_coin = 150

# 그 월드를 처음 깼을 때 한 번만 주는 추가 코인입니다.
first_clear_bonus = 5000

# 런 보상 카르타가 최대치에 닿는 깊이입니다.
# 이 깊이에 도달하면 아래 run_clear_max 를 전부 받고, 그보다 얕으면
# run_clear_min 과 run_clear_max 사이에서 깊이에 비례해 받습니다.
run_clear_carta_full_depth = 7


# ─────────────────────────────────────────────────────────────
#  상점 가격
# ─────────────────────────────────────────────────────────────

# 런 안 상점에서 카드 한 장의 가격 범위입니다. [최저, 최고] 이며 이 사이에서
# 무작위로 정해집니다. 탐험 자금으로 삽니다.
run_shop_card_price = [40, 110]

# 런 안 상점에서 즉시 효과(회복, 저주 제거 등) 하나의 가격 범위입니다.
run_shop_effect_price = [25, 65]

# 런 안 상점에 한 번에 진열되는 물건 수의 범위입니다.
run_shop_stock = [4, 6]

# 런 안 상점의 "HP 회복" 을 샀을 때 회복되는 최대 체력의 비율입니다.
# 0.30 = 최대 체력의 30% 회복.
run_shop_heal_pct = 0.30

# 거점 상점에서 파는 장비의 가격 범위입니다. 코인으로 삽니다.
hub_equipment_price = [3000, 15000]

# 거점 상점의 강화석 가격 계수입니다. 실제 가격은 이 값 × 등급² 이 됩니다.
# 400 이면 1등급 400, 2등급 1600, 3등급 3600 … 으로 가파르게 오릅니다.
hub_stone_price_coefficient = 400


# ─────────────────────────────────────────────────────────────
#  카르타 수입
# ─────────────────────────────────────────────────────────────

# 카르타가 들어오는 경로별 액수입니다.
#   daily               하루 한 번 접속 보상
#   weekly_attendance   한 주를 채웠을 때의 보상
#   run_clear_min/max   런을 깼을 때. 얕게 깨면 min, 끝까지 가면 max.
#   achievement_min/max 업적 하나당 보상의 범위
[carta_income]
daily              = 60
weekly_attendance  = 300
run_clear_min      = 80
run_clear_max      = 150
achievement_min    = 50
achievement_max    = 200

# 런 안에서 탐험 자금이 들어오는 경로별 범위입니다. [최저, 최고] 사이에서
# 무작위로 정해집니다. 올리면 상점을 더 자주 이용할 수 있습니다.
[run_currency_income]
combat_clear = [25, 45]
elite_clear  = [60, 90]
reward_node  = [20, 40]

# 전투와 보상 칸에서 물건이 떨어질 확률과 개수입니다.
#   equipment_combat / equipment_reward  장비가 떨어질 확률 (0.12 = 12%)
#   stone_combat / stone_reward          강화석이 떨어질 확률
#   *_amount                             떨어질 때의 개수 범위 [최저, 최고]
# 보상 칸이 전투보다 후하게 설정되어 있습니다.
[drop_rates]
equipment_combat    = 0.12
equipment_reward    = 0.25
stone_combat        = 0.35
stone_combat_amount = [1, 2]
stone_reward        = 0.60
stone_reward_amount = [2, 4]

# 떨어지는 장비의 등급이 깊이에 따라 얼마나 좋아지는지입니다.
# 월드마다 장비 등급의 최저·최고가 정해져 있고, position 이 그 사이의
# 위치를 뜻합니다 — 0.0 이면 최저 등급, 1.0 이면 최고 등급입니다.
# 위에서부터 차례로 보아 max_depth 이하인 첫 줄이 적용됩니다.
[[equipment_drop_tier_by_depth]]
max_depth = 3
position  = 0.0

[[equipment_drop_tier_by_depth]]
max_depth = 5
position  = 0.5

# 마지막 줄의 max_depth 는 지도의 최대 깊이보다 크게 두어, 어떤 깊이든
# 반드시 적용되는 줄이 있도록 합니다.
[[equipment_drop_tier_by_depth]]
max_depth = 99
position  = 1.0
