#  상태이상 — 화상, 기절, 공격력 증가 같은 지속 효과의 세기
#
#  카드나 적의 행동은 "화상을 건다"고만 정의하고, 화상이 실제로 몇 대미지인지는
#  전부 이 파일이 정합니다. 카드를 건드리지 않고 상태이상만 조정할 수 있습니다.

# 상태이상 하나하나의 세기입니다. 각 상태는 세 값을 가집니다.
#   magnitude  세기. 뜻은 상태마다 다릅니다 — 화상은 라운드당 피해량,
#              방어력_감소는 감소 비율(0.08 = 8%), 속도_감소는 고정 수치입니다.
#              양수는 이롭게, 음수는 해롭게 작용합니다.
#   duration   몇 라운드 뒤에 사라지는지. "없음"이면 시간으로는 사라지지 않고
#              스택을 소모하는 방식으로만 줄어듭니다.
#   stack_cap  겹칠 수 있는 최대 횟수. "없음"이면 상한이 없습니다.
[status_magnitudes]

# 라운드마다 고정 피해를 주고, 피해를 줄 때마다 스택이 하나 줄어듭니다.
# magnitude 는 스택 1개당 라운드 피해량입니다.
"화상" = { magnitude = 3, duration = "없음", stack_cap = "없음" }

# 화상과 같은 구조이지만 피해량이 더 큽니다.
"출혈" = { magnitude = 4, duration = "없음", stack_cap = "없음" }

# 대상의 방어력을 깎습니다. 0.08 = 스택당 8% 감소, 최대 5번까지 겹칩니다.
"방어력_감소" = { magnitude = 0.08, duration = 3, stack_cap = 5 }

# 대상의 공격력을 올립니다. 0.10 = 스택당 10% 증가.
"공격력_증가" = { magnitude = 0.10, duration = 3, stack_cap = 5 }

# 대상이 받는 회복량을 줄입니다. 음수라서 회복에 불리하게 작용합니다.
# -0.15 = 스택당 회복량 15% 감소.
"회복량_감소" = { magnitude = -0.15, duration = 3, stack_cap = 4 }

# 대상의 속도를 떨어뜨려 행동 순서를 늦춥니다. 속도는 비율이 아니라 고정
# 수치로 움직입니다 — -8 = 스택당 속도 8 감소.
"속도_감소" = { magnitude = -8, duration = 3, stack_cap = 4 }

# 대상의 다음 턴을 통째로 넘깁니다. 세기 개념이 없어 magnitude 는 0입니다.
# duration 을 올리면 여러 턴을 연속으로 잃게 되므로 매우 강해집니다.
"기절" = { magnitude = 0, duration = 1, stack_cap = "없음" }

# 대상이 카드를 내지 못하게 합니다. 기본 공격과 방어는 그대로 할 수 있습니다.
"침묵" = { magnitude = 0, duration = 2, stack_cap = "없음" }

# 이 상태인 대상은 방어막에 막히지 않고 체력에 직접 피해를 받습니다.
"보호막_관통" = { magnitude = 0, duration = 2, stack_cap = "없음" }

# 적이 이 상태를 건 대상만 노리게 만듭니다. 아군을 지킬 때 씁니다.
"도발" = { magnitude = 0, duration = 2, stack_cap = "없음" }
