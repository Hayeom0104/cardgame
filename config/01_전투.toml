#  전투 — 한 번의 싸움 안에서 숫자가 결정되는 방식
#
#  이 파일은 "능력치가 어떻게 계산되고 피해가 얼마나 들어가는가"를 다룹니다.
#  그 능력치를 올리는 데 드는 비용은 `05_성장.toml` 에 있습니다.
#
#  빈 값을 나타낼 때는 "없음" 이라고 적습니다.
#  TOML 규칙상 [대괄호] 항목이 시작되면 그 뒤는 모두 그 항목의 내용이 되므로,
#  낱개 설정을 먼저, [대괄호] 설정을 나중에 적습니다.


# ─────────────────────────────────────────────────────────────
#  카드와 자원
# ─────────────────────────────────────────────────────────────

# 자기 턴이 시작될 때 자동으로 뽑는 카드 수입니다.
# 올리면 매 턴 선택지가 늘어나 전투가 쉬워지고, 덱이 빨리 소모됩니다.
draws_per_turn = 3

# 런을 시작할 때 만들어지는 덱의 총 장수입니다.
# 이 크기에 맞춰 기본 카드로 자리를 채웁니다. 런 도중 카드를 얻으면 늘어납니다.
base_deck_size = 18

# 카드 한 장에 매길 수 있는 소모 자원의 최솟값입니다.
# 콘텐츠 검사(§10.5)에서 이 범위를 벗어난 카드는 저장이 거부됩니다.
card_cost_min = 1

# 카드 한 장에 매길 수 있는 소모 자원의 최댓값입니다.
# 한 턴에 쓸 수 있는 자원(resource_pool_by_party_size)보다 크게 두면
# 그 카드는 영영 낼 수 없게 되니 주의하세요.
card_cost_max = 3


# ─────────────────────────────────────────────────────────────
#  피해 계산
# ─────────────────────────────────────────────────────────────

# 속성 상성에서 유리할 때 피해에 곱하는 값입니다. 1.5 = 피해 50% 증가.
element_affinity_advantage = 1.5

# 속성 상성에서 불리할 때 곱하는 값입니다. 0.75 = 피해 25% 감소.
element_affinity_disadvantage = 0.75

# 상성 관계가 없을 때 곱하는 값입니다. 보통 1.0(그대로) 그대로 둡니다.
element_affinity_neutral = 1.0

# 방어력이 아무리 높아도 공격이 들어가면 최소한 이만큼은 깎입니다.
# 0으로 두면 방어력이 충분한 상대에게 영영 피해를 줄 수 없게 되어
# 전투가 끝나지 않을 수 있습니다.
minimum_damage_floor = 1

# 낼 카드가 없어 자동으로 방어할 때 얻는 방어막의 배율입니다.
# 방어력 1당 방어막 1(=1.0)을 얻습니다.
auto_defend_block_multiplier = 1.0

# "기본 방어" 카드를 직접 냈을 때의 방어막 배율입니다.
# 자동 방어보다 높게 두어야 카드를 쓰는 쪽이 이득이 됩니다.
basic_defense_block_multiplier = 1.5


# ─────────────────────────────────────────────────────────────
#  전투 진행의 한계
# ─────────────────────────────────────────────────────────────

# 한 전투가 이 라운드 수를 넘기면 콘텐츠 검사에서 경고합니다.
# 소환 등으로 적이 끝없이 늘어나는 조합을 걸러내기 위한 기준입니다.
encounter_round_budget = 12

# 한 전투에 동시에 존재할 수 있는 적의 최대 수입니다. 소환으로 늘어난 적도 포함합니다.
max_enemies_per_encounter = 8

# 계정이 해금할 수 있는 파티 자리의 최대 수입니다.
# 연구로 자리를 늘려도 이 값을 넘지 못합니다.
max_party_slots = 3

# 플레이어 입력 없이 자동으로 진행할 수 있는 턴 수의 상한입니다.
# 적 턴이 연달아 이어질 때 무한 반복을 막는 안전장치이며, 정상 전투에서는
# 절대 닿지 않는 값이어야 합니다. 여기에 걸리면 그건 버그입니다.
battle_max_turns_per_advance = 64

# §2.13 반응형 능력(반격)이 서로를 연쇄로 발동시킬 수 있는 최대 깊이입니다.
# A를 반격한 B를 A가 다시 반격하는 콘텐츠 조합이 턴을 무한히 붙들지 않도록
# 막는 안전장치이며, 정상적인 한 벌의 반격에서는 닿지 않는 값이어야 합니다.
reactive_ability_max_depth = 4


# ─────────────────────────────────────────────────────────────
#  보스 페이즈
# ─────────────────────────────────────────────────────────────

# 보스의 남은 체력이 이 비율 아래로 내려갈 때마다 다음 페이즈로 넘어갑니다.
# 0.70 = 체력 70%, 0.30 = 체력 30%. 보스마다 따로 지정할 수도 있습니다.
boss_phase_thresholds = [0.70, 0.30]

# 페이즈가 바뀌는 순간 보스가 무적이 되는 라운드 수입니다.
# 연출용 유예이며, 0으로 두면 무적 없이 곧장 다음 페이즈로 넘어갑니다.
transition_invulnerable_rounds = 1

# 페이즈 전환으로 보스가 "각성"했을 때 강화가 유지되는 라운드 수입니다.
transition_awakening_rounds = 3

# 각성한 보스의 공격력 증가폭입니다. 30 = 30% 증가.
transition_awakening_atk_pct = 30

# 각성한 보스의 속도 증가폭입니다. 비율이 아니라 고정 수치로 더합니다.
# 속도는 설계상 곱셈으로 다루지 않습니다.
transition_awakening_spd_flat = 15


# ─────────────────────────────────────────────────────────────
#  능력치 계산
# ─────────────────────────────────────────────────────────────

# 파티 인원수별로, 매 턴 카드를 내는 데 쓸 수 있는 자원의 양입니다.
# 왼쪽이 인원수, 오른쪽이 자원량입니다.
[resource_pool_by_party_size]
1 = 3
2 = 4
3 = 5

# 역할군별 1성 기준 능력치입니다. 모든 캐릭터 능력치가 여기서 출발합니다.
#   hp  = 체력, atk = 공격력, def = 방어력, spd = 속도(행동 순서)
# 속도가 높을수록 먼저 움직입니다.
[base_stats_by_role]
"공격형"     = { hp = 65, atk = 12, def = 5,  spd = 105 }
"방어형"     = { hp = 95, atk = 7,  def = 10, spd = 85 }
"서포터형"   = { hp = 70, atk = 6,  def = 6,  spd = 100 }
"디버퍼형"   = { hp = 68, atk = 8,  def = 5,  spd = 110 }
"딜서포트형" = { hp = 75, atk = 10, def = 6,  spd = 95 }

# 성급(★)이 하나 오를 때마다 각 능력치가 늘어나는 비율입니다.
# 0.12 = 성급당 12% 증가. 속도는 0.0으로 고정되어 있습니다 — 속도는
# 곱해서 올리지 않고, 장비의 고정 수치나 "속도 감소" 상태로만 움직입니다.
[star_bonus_per_stat]
hp  = 0.12
atk = 0.10
def = 0.08
spd = 0.0

# 적의 등급별 능력치 범위입니다. 적을 만들 때 이 범위 안에서 뽑습니다.
# 각 값은 [최솟값, 최댓값] 이며, 두 값이 같으면 항상 그 값이 됩니다.
[enemy_bands]
"일반"   = { hp = [45, 70],   atk = [8, 12],  def = [3, 6],  spd = [80, 110] }
"엘리트" = { hp = [110, 150], atk = [14, 18], def = [6, 10], spd = [90, 115] }
"보스"   = { hp = [450, 450], atk = [20, 26], def = [8, 12], spd = [95, 105] }
