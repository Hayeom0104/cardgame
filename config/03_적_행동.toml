#  적 행동 — 적이 누구를 노릴지 정하는 기준
#
#  적은 매 턴 아군 한 명을 "위협도" 점수로 고릅니다. 점수가 높을수록 자주
#  맞습니다. 이 파일을 조정하면 적이 물몸 서포터를 집요하게 노리게 만들 수도,
#  앞에 선 방어형부터 때리게 만들 수도 있습니다.

# 적의 역할군(바깥)이 아군의 역할군(안쪽)을 얼마나 노리는지에 대한 가중치입니다.
# 1.0 이 기준이고, 2.5 는 기준의 2.5배로 자주 노린다는 뜻입니다.
#
# 예) 적이 공격형일 때 아군 서포터형의 값이 2.5 이므로, 적 공격형은 아군
#     서포터를 가장 먼저 노립니다. 반대로 방어형은 0.6 이라 잘 맞지 않습니다.
#
# 표는 빈칸 없이 모두 채워야 합니다. 한 칸이라도 비면 콘텐츠 검사(§10.5)가
# 저장을 거부합니다 — 빠진 칸이 조용히 0으로 처리되면 그 조합에서 적이
# 아무도 노리지 않게 되기 때문입니다.
[threat_weights]
"공격형"   = { "공격형" = 1.0, "방어형" = 0.6, "서포터형" = 2.5, "디버퍼형" = 1.3, "딜서포트형" = 1.3 }
"방어형"   = { "공격형" = 2.0, "방어형" = 0.7, "서포터형" = 1.0, "디버퍼형" = 0.9, "딜서포트형" = 1.4 }
"서포터형" = { "공격형" = 1.2, "방어형" = 0.6, "서포터형" = 1.1, "디버퍼형" = 2.2, "딜서포트형" = 1.0 }
