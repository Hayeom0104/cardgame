#  화면 — 그림으로 그려지는 모든 것의 크기와 색
#
#  이 파일은 게임의 *겉모습*만 정합니다. 여기 값을 바꿔도 피해량이나 확률처럼
#  게임 결과에 영향을 주는 것은 하나도 없습니다.
#
#  그래서 다른 설정 파일과 달리 **콘텐츠 버전에 고정되지 않고 파일에서 곧장
#  읽습니다.** 색을 바꾸면 새 버전을 발행하지 않아도 다음 화면부터 바로
#  반영됩니다. 진행 중인 런도 함께 바뀝니다 — 겉모습이라 그래도 됩니다.
#
#  색은 [빨강, 초록, 파랑] 이며 각각 0~255 입니다.


# ─────────────────────────────────────────────────────────────
#  화면 크기 (가로, 세로 / 단위: 픽셀)
# ─────────────────────────────────────────────────────────────

# 전투 화면에서 아군·적 패널 각각의 크기입니다. 두 장이 한 번에 붙어 나갑니다.
panel_size = [720, 360]

# 지도 화면의 크기입니다. 칸이 많아 가장 넓습니다.
map_size = [900, 560]

# 상점 화면의 크기입니다. 진열 칸 수(run_shop_stock)가 많으면 넓혀야 합니다.
shop_size = [900, 520]

# 뽑기 배너 화면의 크기입니다.
banner_size = [860, 420]

# 뽑기 결과 화면의 크기입니다. 10연차 결과가 한 화면에 들어가야 합니다.
gacha_result_size = [960, 460]

# 준비 화면(파티·덱 확인)의 크기입니다.
prep_size = [900, 500]

# 카드 한 장을 그릴 때의 크기입니다. 손패와 상점에서 이 크기로 그립니다.
card_size = [180, 250]

# 캐릭터 초상화의 크기입니다.
portrait_size = [140, 140]

# 화면 가장자리에서 내용까지 띄우는 여백입니다.
screen_padding = 20

# 카드나 칸을 나란히 놓을 때 사이에 두는 간격입니다.
tile_gap = 14

# 모서리를 둥글게 깎는 정도입니다. 0이면 각진 사각형이 됩니다.
corner_radius = 10

# 전투 화면 하단 로그 창에 보여줄 줄 수입니다.
battle_log_lines = 4


# ─────────────────────────────────────────────────────────────
#  글자 크기
# ─────────────────────────────────────────────────────────────

# 화면 맨 위 제목의 글자 크기입니다.
font_size_title = 26

# 이름·항목 등 보통 글자의 크기입니다.
font_size_body = 18

# 설명이나 부가 정보처럼 작게 들어가는 글자의 크기입니다.
font_size_small = 14

# 글꼴 파일을 찾는 순서입니다. 위에서부터 찾되, **한글이 실제로 그려지는**
# 글꼴을 우선합니다 — 설치는 되어 있지만 한글 글리프가 없는 글꼴(DejaVu 등)을
# 골라 이름이 전부 네모로 나오는 일을 막기 위해서입니다.
#
# 원하는 글꼴을 쓰려면 .ttf 파일을 `assets/fonts/main.ttf` 로 넣으면 됩니다.
# 맨 위에 이미 적혀 있으므로 그 자리에 두기만 하면 바로 적용됩니다.
font_candidates = [
  "assets/fonts/main.ttf",
  "/usr/share/fonts/truetype/nanum/NanumGothic.ttf",
  "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
  "/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc",
  "/usr/share/fonts/truetype/fonts-japanese-gothic.ttf",
  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
]


# ─────────────────────────────────────────────────────────────
#  색
# ─────────────────────────────────────────────────────────────

# 화면 전체의 바탕색입니다.
color_background = [24, 26, 34]

# 패널·카드 등 내용이 올라가는 칸의 바탕색입니다.
color_panel = [34, 37, 48]

# 보통 글자의 색입니다.
color_text = [232, 234, 240]

# 설명처럼 덜 중요한 글자의 색입니다.
color_muted = [150, 156, 172]

# 체력이 가득 찼을 때의 막대 색입니다.
color_hp_full = [96, 200, 120]

# 체력이 낮을 때의 막대 색입니다. 체력이 줄면 위 색에서 이 색으로 섞입니다.
color_hp_low = [216, 92, 92]

# 방어막 막대의 색입니다.
color_block = [110, 170, 230]

# 강조하고 싶은 것(가격, 선택된 칸)에 쓰는 색입니다.
color_accent = [226, 186, 96]

# 칸의 테두리 색입니다.
color_border = [58, 62, 78]

# 이미 지나온 지도 칸의 색입니다.
color_visited = [70, 76, 92]

# 지금 갈 수 있는 지도 칸의 테두리 색입니다.
color_selectable = [226, 186, 96]

# 이미 팔린 상점 물건에 덮는 색입니다.
color_sold_out = [60, 40, 44]


# ─────────────────────────────────────────────────────────────
#  표면 표현 — 그라데이션·그림자·발광
#
#  평면 사각형과 단색 막대만으로는 무엇을 먼저 봐야 하는지 드러나지 않아,
#  아래 값으로 표면에 깊이와 강조를 줍니다. 전부 겉모습이라 게임 결과에는
#  영향이 없습니다.
# ─────────────────────────────────────────────────────────────

# 전투 화면 배경 그라데이션에 섞는 색입니다.
color_tint_battle = [58, 40, 78]

# 지도 화면 배경 그라데이션에 섞는 색입니다.
color_tint_map = [40, 52, 84]

# 상점 화면 배경 그라데이션에 섞는 색입니다.
