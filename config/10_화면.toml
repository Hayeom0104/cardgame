# 화면 가장자리를 어둡게 눌러 가운데로 시선을 모으는 세기입니다. 0이면 끕니다.
background_vignette_strength = 0.55

# 칸 바탕 그라데이션의 윗색입니다. 아랫색은 color_panel 을 씁니다.
color_panel_top = [46, 50, 70]

# 지금 차례인 유닛 둘레에 번지는 빛의 세기(0~255)입니다.
glow_opacity_active = 110

# 지도에서 갈 수 있는 칸 둘레에 번지는 빛의 세기(0~255)입니다.
glow_opacity_available = 105

# 칸 아래에 까는 그림자의 진하기(0~255)입니다.
shadow_opacity = 130

# 체력이 넉넉할 때 게이지의 어두운 쪽 색입니다. 밝은 쪽은 color_hp_full 입니다.
color_hp_full_low = [64, 176, 112]

# 체력이 절반 아래로 떨어졌을 때 게이지의 밝은 쪽 색입니다.
color_hp_hurt = [240, 180, 90]

# 체력이 절반 아래로 떨어졌을 때 게이지의 어두운 쪽 색입니다.
