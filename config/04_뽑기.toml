#  뽑기 — 확률, 천장, 가격
#
#  가장 민감한 파일입니다. 확률을 바꾸면 이미 뽑은 사람과 앞으로 뽑을 사람의
#  기댓값이 달라지므로, 콘텐츠 버전을 새로 발행해서 반영하는 것을 권장합니다.
#  진행 중인 런은 시작할 때의 값을 그대로 유지합니다.


# ─────────────────────────────────────────────────────────────
#  천장 (뽑을수록 확률이 오르는 장치)
# ─────────────────────────────────────────────────────────────

# 이 횟수까지는 최고 등급 확률이 오르지 않고 그대로 유지됩니다.
# 70 이면 71번째 뽑기부터 확률이 오르기 시작합니다.
pity_soft_start = 70

# 위 횟수를 넘긴 뒤로 한 번 뽑을 때마다 최고 등급 확률에 더해지는 값입니다.
# 0.05 = 뽑을 때마다 +5%p.
pity_soft_increment = 0.05

# 이 횟수에 도달하면 최고 등급이 반드시 나옵니다(확정 천장).
# 여기서 최고 등급이 나오면 누적 횟수는 0으로 돌아갑니다.
pity_hard = 90

# 확률이 오르는 동안 중간 등급이 유지하는 고정 확률입니다.
# 오른 만큼은 기본 등급에서 가져오고, 기본 등급이 더 내줄 수 없게 되면
# 그때부터 중간 등급도 줄어듭니다.
pity_mid_band_fixed = 0.12

# 한정 배너에서 "이번 최고 등급이 픽업 대상일 확률"입니다.
# 0.5 = 반반. 빗나가면 다음 최고 등급은 픽업이 확정됩니다.
limited_5050_rate = 0.5


# ─────────────────────────────────────────────────────────────
#  가격과 횟수
# ─────────────────────────────────────────────────────────────

# 1회 뽑기에 드는 카르타입니다.
gacha_cost_single = 160

# 10회 뽑기에 드는 카르타입니다. 1회 × 10 보다 싸게 두면 묶음 뽑기에
# 이득이 생깁니다. 지금은 정확히 10배라 할인이 없습니다.
gacha_cost_ten = 1600

# "10회 뽑기"가 실제로 뽑는 횟수입니다. 이름과 달리 값을 바꾸면 그대로 따릅니다.
gacha_ten_pull_size = 10

# 계정이 처음 뽑을 때, 이 횟수 안에 캐릭터가 반드시 한 번은 나오도록 보장합니다.
# 튜토리얼을 마친 계정이 두 번째 캐릭터를 얻어 본편(파티 2명)에 들어갈 수 있게
# 하는 장치이므로, 0으로 만들면 본편 진입이 막힐 수 있습니다.
first_pull_guarantee_window = 10

# 모든 등급에서, 뽑은 결과가 캐릭터일 확률입니다.
# 0.3 = 캐릭터 3 : 카드 7. 등급을 먼저 정하고, 그 안에서 이 비율로 갈립니다.
gacha_character_split = 0.3


# ─────────────────────────────────────────────────────────────
#  등급별 확률과 내용물
# ─────────────────────────────────────────────────────────────

# 천장이 개입하지 않을 때의 등급별 기본 확률입니다.
#   top  최고 등급, mid 중간 등급, base 기본 등급
# 0.015 = 1.5% 입니다. 세 값의 합은 반드시 1.0 이어야 하며, 아니면 검사에서
# 걸립니다.
[gacha_base_rates]
top  = 0.015
mid  = 0.12
base = 0.865

# 각 등급에서 캐릭터가 나왔을 때 그 캐릭터의 시작 성급(★)입니다.
[gacha_band_star_rank]
top  = 3
mid  = 2
base = 1

# 각 등급에서 카드가 나왔을 때 뽑힐 수 있는 카드의 희귀도입니다.
# 여러 개를 적으면 그 중에서 고릅니다. 모든 희귀도가 어느 한 등급에는
# 들어가 있어야 합니다 — 어디에도 없는 희귀도의 카드는 영영 뽑히지 않습니다.
[gacha_band_rarity_tiers]
top  = [6]
mid  = [4, 5]
base = [1, 2, 3]

# 이미 가진 것을 또 뽑았을 때 대신 받는 재료입니다. 왼쪽 숫자는 "지금 가지고
# 있는 성급"이며, 성급이 높은 캐릭터가 중복될수록 많이 돌려받습니다.
#   fragments  그 캐릭터 전용 조각. 모으면 성급을 올릴 수 있습니다.
#   wildcards  아무 캐릭터에나 쓸 수 있는 범용 재료.
[duplicate_character_yield]
1 = { fragments = 15, wildcards = 1 }
2 = { fragments = 30, wildcards = 2 }
3 = { fragments = 60, wildcards = 3 }

# 이미 가진 카드를 또 뽑았을 때 받는 카드 조각입니다.
# 왼쪽 숫자는 그 카드의 희귀도입니다. 조각은 카드 업그레이드에 씁니다.
[duplicate_card_yield]
1 = 5
2 = 5
3 = 5
4 = 15
5 = 15
6 = 30
