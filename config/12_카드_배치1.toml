#  카드 배치 1 — 첫 콘텐츠 저작 패스의 카드 풀 "모양"
#
#  이 파일은 개별 카드의 이름·효과·그림을 정하지 않습니다(그건 대시보드에서
#  콘텐츠 작업자가 합니다) — 몇 장을, 어떤 비용·등급 비율로 만들지만 정해서
#  §10.5 콘텐츠 검사가 그 모양을 지키는지 확인하게 합니다.
#  (Design Addendum A-2 — Card Batch 1 Scope)
#
#  최고등급(6티어)은 이 배치에서 아예 빠집니다(배치 2로 미룸) — 등급 구간은
#  config/04_뽑기.toml 의 gacha_band_rarity_tiers 를 그대로 씁니다.


# 배치 1 검사를 켤지 여부입니다. 꺼져 있으면(기본값) 아래 수치와 무관하게
# 검사를 건너뜁니다 — 아직 로스터도 12명이 아니고(현재 가챠풀 7명) 카드도
# 저작 전이라, 검사를 미리 켜 두면 지금 있는 플레이스홀더 콘텐츠부터
# §10.5에 걸립니다. 로스터가 채워지고 배치 1 저작이 실제로 끝나면 이
# 값을 true로 바꿔서 검사를 활성화하세요.
# 현재 확장 카드 풀은 Addendum A-2의 고정 2/3비용 구조와 아직 일치하지
# 않아 초기 콘텐츠 발행과 관리자 대시보드 기동을 막는다. 배치가 완성될
# 때까지 검증을 비활성화한다.
batch1_shape_enforced = false

# 캐릭터 전용 카드 중 비용2·기본등급(1-3티어) 카드가 가챠풀 캐릭터
# (스타터 제외, in_gacha_pool=1) 한 명당 몇 장이어야 하는지입니다.
# "캐릭터별 편차 없음"이 이번 배치의 규칙이라(A-2.2), 특정 캐릭터
# 하나하나가 아니라 전체 합으로 검사합니다 — 카드 테이블에 카드를 특정
# 캐릭터에 묶는 자리가 없고, 원소가 같으면 여러 캐릭터가 같은 카드를
# 함께 쓰기 때문입니다(§2.10).
batch1_char_exclusive_cost2_basic_per_character = 2

# 캐릭터 전용 카드 중 비용3·중간등급(4-5티어) 카드가 캐릭터 한 명당
# 몇 장이어야 하는지입니다. 위 항목과 같은 이유로 전체 합으로 검사합니다.
batch1_char_exclusive_cost3_mid_per_character = 1

# 무속성(범용) 카드 — 배치 전체에서 정확히 이 장수여야 합니다.
batch1_universal_total = 12

# 무속성 카드 중 기본등급(1-3티어)이 몇 장이어야 하는지입니다.
batch1_universal_basic_count = 8

# 무속성 카드 중 중간등급(4-5티어)이 몇 장이어야 하는지입니다. 위 항목과
# 더하면 batch1_universal_total 과 같아야 합니다.
batch1_universal_mid_count = 4

# 무속성 카드의 비용별 장수입니다. 셋을 더하면 batch1_universal_total 과
# 같아야 합니다. 낱개 설정보다 뒤에 와야 합니다 — TOML 규칙상 [대괄호]
# 항목 뒤는 전부 그 항목의 내용이 됩니다.
[batch1_universal_cost_split]
1 = 4
2 = 4
3 = 4
